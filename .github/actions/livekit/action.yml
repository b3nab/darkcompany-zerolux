name: Build the LiveKit server
description: livekit-server from its source, for this runner's system, first on the PATH. ZeroLux carries it, and LiveKit publishes no build for macOS.

inputs:
  version:
    description: The LiveKit server release to build.
    default: v1.13.7

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: livekit/livekit
        ref: ${{ inputs.version }}
        path: .livekit
    - uses: actions/setup-go@v5
      with:
        go-version-file: .livekit/go.mod
        cache-dependency-path: .livekit/go.sum
    - name: Build it
      shell: bash
      working-directory: .livekit
      run: |
        go generate ./...
        # On macOS it reads the CPU's load through cgo; elsewhere it is pure Go.
        if [[ "$RUNNER_OS" == macOS ]]; then export CGO_ENABLED=1; else export CGO_ENABLED=0; fi
        extension=""
        [[ "$RUNNER_OS" == Windows ]] && extension=".exe"
        mkdir -p "$RUNNER_TEMP/livekit"
        go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/livekit/livekit-server$extension" ./cmd/server
        echo "$RUNNER_TEMP/livekit" >> "$GITHUB_PATH"
    - shell: bash
      run: livekit-server --version
