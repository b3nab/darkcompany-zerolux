name: Set up the build
description: Rust, Bun, uv and the native tools the kernel and the desktop build with, the JavaScript packages, and LiveKit when asked.

inputs:
  rust:
    description: "build: Rust with clippy and nextest, its build cache and the native libraries the kernel and the desktop link; format: rustfmt alone; none: no Rust."
    default: build
  native:
    description: "The native libraries the Rust build links on Linux: desktop, the app's with the kernel's; kernel, the kernel's alone."
    default: desktop
  cache-key:
    description: What the Rust build cache is kept under, beside the runner's system.
    default: build
  cache-target:
    description: Cargo output directory relative to the repository root.
    default: target
  cache-save:
    description: Whether this job keeps its Rust build cache for the next ones.
    default: "true"
  target:
    description: A Rust target to build for besides this runner's system, as x86_64-apple-darwin.
    default: ""
  javascript:
    description: Whether to set up Bun, uv and the JavaScript packages.
    default: "true"
  workspaces:
    description: "The JavaScript workspaces to install, as Bun's filters separated by spaces: './harnesses/*'; all of them when empty."
    default: ""
  livekit:
    description: Also build the LiveKit server, first on the PATH.
    default: "false"
  livekit-arch:
    description: The architecture the LiveKit server runs on, as Go names it, when it is not this runner's.
    default: ""

runs:
  using: composite
  steps:
    # webrtc-sys builds its C++ against Chromium's hermetic libc++, which requires Clang 21+,
    # newer than the runner's. https://github.com/livekit/rust-sdks#building
    # The packages the runner lacks are kept once downloaded, LLVM's from apt.llvm.org: a new
    # runner image starts from the last ones kept, and downloads again only what apt refuses.
    - id: image
      if: runner.os == 'Linux' && inputs.rust == 'build'
      shell: bash
      run: |
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux' && inputs.rust == 'build'
      uses: actions/cache@v4
      with:
        path: ~/apt-packages
        key: apt-${{ inputs.native }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/action.yml') }}-${{ steps.image.outputs.version }}
        restore-keys: apt-${{ inputs.native }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/action.yml') }}-
    - name: Install Clang and the desktop's native libraries and packaging tools
      if: runner.os == 'Linux' && inputs.rust == 'build'
      shell: bash
      env:
        NATIVE: ${{ inputs.native }}
      run: |
        # The kernel's: webrtc-sys also reads glib's headers.
        packages=(build-essential clang-21 libclang-21-dev libc6-dev pkg-config libglib2.0-dev)
        modules=(glib-2.0 gobject-2.0 gio-2.0)
        if [[ "$NATIVE" == desktop ]]; then
          packages+=(libjpeg-turbo8-dev libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils)
          modules+=(webkit2gtk-4.1)
        fi
        shopt -s nullglob
        kept=(~/apt-packages/*.deb)
        # The kept files, unless this image needs newer or other packages: apt refuses them
        # before changing anything, and they are downloaded again.
        if ! (( ${#kept[@]} )) || ! sudo apt-get install -y --no-install-recommends "${kept[@]}"; then
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
          fingerprint="$(gpg --batch --show-keys --with-colons llvm.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -m 0644 llvm.asc /usr/share/keyrings/apt-llvm.asc
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          rm llvm.asc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only "${packages[@]}"
          rm -rf ~/apt-packages && mkdir ~/apt-packages
          cp /var/cache/apt/archives/*.deb ~/apt-packages/
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
        fi
        clang-21 --version
        pkg-config --exists "${modules[@]}"
        {
          echo "CC=clang-21"
          echo "CXX=clang++-21"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib"
        } >> "$GITHUB_ENV"
    - if: inputs.rust != 'none'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust == 'build' && 'rustfmt, clippy' || 'rustfmt' }}
        targets: ${{ inputs.target }}
    - if: inputs.rust == 'build'
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key }}
        workspaces: . -> ${{ inputs.cache-target }}
        save-if: ${{ inputs.cache-save }}
    # The tests run each in a process of its own, side by side across the workspace.
    - if: inputs.rust == 'build'
      uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      with:
        tool: cargo-nextest@0.9.151
    - if: inputs.javascript == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.2"
    # The kernel carries it to run the Python parts of extensions.
    - if: inputs.javascript == 'true'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
    - if: inputs.javascript == 'true'
      shell: bash
      env:
        WORKSPACES: ${{ inputs.workspaces }}
      run: |
        set -f
        filters=()
        for workspace in $WORKSPACES; do filters+=(--filter "$workspace"); done
        bun install --frozen-lockfile "${filters[@]}"
    - if: inputs.livekit == 'true'
      uses: ./.github/actions/livekit
      with:
        arch: ${{ inputs.livekit-arch }}
