name: Release

# A version tag, made by `bun run release <version>` and pushed by the owner: its release is
# drafted with its changelog, then gets the kernel and the desktop app for macOS, Linux and
# Windows, each with the Bun and the LiveKit server it starts, and the Android app. It is
# published once every build is in; a build that fails leaves it a draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Draft the release with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Its section of CHANGELOG.md, without the heading the release's title repeats.
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft $prerelease \
            --title "ZeroLux $version" --notes-file notes.md

  kernel:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
          # The oldest supported Ubuntu, so the builds run with older glibc versions too.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - uses: ./.github/actions/livekit
      - name: Bundle the web app, sign-in and runners
        run: bun run --cwd apps/desktop assets
      - name: Build the kernel
        run: cargo build --release --locked -p zerolux
      - name: Pack it with its bundles and upload it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="zerolux-$GITHUB_REF_NAME-${{ matrix.target }}"
          # As in /usr/local: in bin the kernel, with the Bun and the LiveKit server it starts;
          # in share/zerolux what it serves and runs.
          mkdir -p "$name/bin" "$name/share/zerolux"
          extension=""
          [[ "$RUNNER_OS" == Windows ]] && extension=".exe"
          cp "target/release/zerolux$extension" "$name/bin/"
          for program in bun livekit-server; do
            cp "$(dirname "$(command -v "$program")")/$program$extension" "$name/bin/"
          done
          cp -R apps/desktop/dist/web apps/desktop/dist/auth apps/desktop/dist/claude apps/desktop/dist/pi "$name/share/zerolux/"
          cp LICENSE README.md "$name/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$name.zip"
            7z a -bso0 "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive"

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26 }
          - { os: macos-26-intel }
          - { os: ubuntu-22.04 }
          - { os: windows-2025 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - uses: ./.github/actions/livekit
      # Signed and notarized with the Apple Developer ID when its secrets are set; otherwise
      # signed ad hoc, which Apple Silicon needs to open it at all.
      - name: Choose how the macOS app is signed
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: bun x --bun tauri
          tagName: ${{ github.ref_name }}
          releaseDraft: true

  # The mobile app for Android, as an APK for 64-bit ARM phones. Signed with the release key
  # when its secrets are set; otherwise with the debug key, which installs but cannot be
  # updated by a build signed with the release key later.
  android:
    needs: draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Generate the Android project
        working-directory: apps/mobile
        run: bun x --bun expo prebuild --platform android --no-install
      # Expo's template packs the Gradle wrapper so that `java -jar` cannot open it: Gradle
      # writes its own again, of the version the project names.
      - name: Write the Gradle wrapper again
        working-directory: apps/mobile/android
        run: |
          version="$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain wrapper --gradle-version "$version"
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Sign it and upload it
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk="zerolux-$GITHUB_REF_NAME-android-arm64.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > release.keystore
            apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
            "$apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD "$apk"
            rm release.keystore
            "$apksigner" verify "$apk"
          fi
          gh release upload "$GITHUB_REF_NAME" "$apk"

  publish:
    needs: [kernel, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
