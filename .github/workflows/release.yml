name: Release

# Tags publish beta/RC and stable releases. Scheduled or manual builds publish a nightly.
# Every artifact is signed; the channel feed moves only after all checks and builds succeed.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Reserve nightly numbers and update channel pointers in one publication at a time.
  group: release
  cancel-in-progress: false

jobs:
  # The checks run beside the builds, every test with them: only publishing waits for them.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      tests: full

  draft:
    name: Draft
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.build.outputs.tag }}
      channel: ${{ steps.build.outputs.channel }}
      commit: ${{ steps.build.outputs.commit }}
      built_at: ${{ steps.build.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Require update signing configuration
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.ZEROLUX_UPDATE_PUBLIC_KEY }}
        run: test -n "$SIGNING_KEY" && test -n "$PUBLIC_KEY"
      - name: Identify this build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-ci.ts prepare
      - name: Draft the release with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ steps.build.outputs.tag }}
          CHANNEL: ${{ steps.build.outputs.channel }}
          COMMIT: ${{ steps.build.outputs.commit }}
          RESUME: ${{ steps.build.outputs.resume }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [[ "$CHANNEL" == nightly ]]; then
            printf 'Nightly build from commit `%s`.\n' "$COMMIT" > "$notes"
          else
            awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > "$notes"
            test -s "$notes" || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          fi
          printf '\n<!-- zerolux-run:%s -->\n' "$GITHUB_RUN_ID" >> "$notes"
          prerelease=""
          [[ "$CHANNEL" != stable ]] && prerelease="--prerelease"
          if [[ "$RESUME" != true ]]; then
            gh release create "$TAG" --target "$COMMIT" --draft $prerelease \
              --title "ZeroLux $VERSION" --notes-file "$notes"
          fi
          cp "$RUNNER_TEMP/zerolux-build.json" "$RUNNER_TEMP/build.json"
          gh release upload "$TAG" "$RUNNER_TEMP/build.json" --clobber

  # The app and the kernel for each system from one build: the kernel's own program is built
  # after the app, from the same compiled dependencies.
  desktop:
    name: Desktop and kernel (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-26, target: aarch64-apple-darwin }
          # Built on Apple silicon for Intel Macs, with the programs the kernel carries for them.
          - {
              name: macOS x64,
              os: macos-26,
              target: x86_64-apple-darwin,
              intel: true,
            }
          # The oldest supported Ubuntu, so the builds run with older glibc versions too.
          - {
              name: Linux x64,
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
            }
          - {
              name: Windows x64,
              os: windows-2025,
              target: x86_64-pc-windows-msvc,
            }
    runs-on: ${{ matrix.os }}
    env:
      # Tauri names the installed binary zerolux; keep its output separate from the CLI.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop
      ZEROLUX_BUILD_VERSION: ${{ needs.draft.outputs.version }}
      ZEROLUX_BUILD_CHANNEL: ${{ needs.draft.outputs.channel }}
      ZEROLUX_BUILD_COMMIT: ${{ needs.draft.outputs.commit }}
      ZEROLUX_BUILD_BUILT_AT: ${{ needs.draft.outputs.built_at }}
      ZEROLUX_UPDATE_PUBLIC_KEY: ${{ vars.ZEROLUX_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up (Bun, Rust, uv, LiveKit)
        uses: ./.github/actions/setup
        with:
          cache-key: release-${{ matrix.target }}
          cache-target: target/desktop
          target: ${{ matrix.target }}
          livekit: "true"
          livekit-arch: ${{ matrix.intel && 'amd64' || '' }}
      # The same Bun and uv the setup installs, for Intel, from their verified releases.
      - name: Bun and uv for Intel Macs
        if: matrix.intel
        working-directory: ${{ runner.temp }}
        run: |
          bun="https://github.com/oven-sh/bun/releases/download/bun-v1.4.2"
          uv="https://github.com/astral-sh/uv/releases/download/0.13.1"
          curl -fsSLO "$bun/bun-darwin-x64.zip" -fsSLO "$bun/SHASUMS256.txt"
          grep ' bun-darwin-x64.zip$' SHASUMS256.txt | shasum -a 256 -c -
          curl -fsSLO "$uv/uv-x86_64-apple-darwin.tar.gz" -fsSLO "$uv/uv-x86_64-apple-darwin.tar.gz.sha256"
          shasum -a 256 -c uv-x86_64-apple-darwin.tar.gz.sha256
          unzip -q bun-darwin-x64.zip
          tar xzf uv-x86_64-apple-darwin.tar.gz
          echo "ZEROLUX_CARRY_BUN=$RUNNER_TEMP/bun-darwin-x64/bun" >> "$GITHUB_ENV"
          echo "ZEROLUX_CARRY_UV=$RUNNER_TEMP/uv-x86_64-apple-darwin/uv" >> "$GITHUB_ENV"
      # The packaging tools Tauri downloads for Linux, kept.
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}
      # Signed and notarized with the Apple Developer ID when its secrets are set; otherwise
      # signed ad hoc, which Apple Silicon needs to open it at all.
      - name: Choose how the macOS app is signed
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
      - name: Configure the version and updater bundles
        run: bun scripts/release-ci.ts config "${{ runner.temp }}/zerolux-tauri.json"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Keep the CLI's noninteractive CI packaging instead of forcing Finder.
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          projectPath: apps/desktop
          tauriScript: bun x --bun tauri
          tagName: ${{ needs.draft.outputs.tag }}
          releaseDraft: true
          args: --config ${{ runner.temp }}/zerolux-tauri.json --target ${{ matrix.target }} --verbose
          updaterJsonPreferNsis: true
      # One file: the kernel with its web app, sign-in, runners, Bun and LiveKit server inside.
      # Both packages resolve their dependencies as the app's build did, and on macOS for the
      # same oldest system, so only the kernel's own program is compiled.
      - name: Build the kernel
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export MACOSX_DEPLOYMENT_TARGET="$(bun -e 'console.log((await Bun.file("tauri.conf.json").json()).bundle.macOS.minimumSystemVersion)')"
          fi
          cargo build --release --locked -p zerolux-desktop -p zerolux --bin zerolux --target ${{ matrix.target }}
      - name: Sign and upload it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          extension=""
          [[ "$RUNNER_OS" == Windows ]] && extension=".exe"
          file="$GITHUB_WORKSPACE/zerolux-$TAG-${{ matrix.target }}$extension"
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/zerolux$extension" "$file"
          cd apps/desktop
          bun x --bun tauri signer sign --app-version "$ZEROLUX_BUILD_VERSION" "$file"
          gh release upload "$TAG" "$file" "$file.sig" --clobber
      # webrtc-sys carries WebRTC in its own library, and downloads it again if it builds again:
      # the download, as large again, stays out of the cache. Build scripts' own dependencies,
      # as the one it downloads into, build for this runner, outside the target's folder.
      - name: Leave WebRTC's download out of the cache
        shell: bash
        run: rm -rf "$CARGO_TARGET_DIR"/release/build/scratch-*/out/livekit_webrtc "$CARGO_TARGET_DIR"/*/release/build/scratch-*/out/livekit_webrtc

  # The mobile app for Android, as an APK for 64-bit ARM phones. Signed with the release key
  # when its secrets are set; otherwise with the debug key, which installs but cannot be
  # updated by a build signed with the release key later.
  android:
    name: Android
    needs: draft
    runs-on: ubuntu-24.04
    env:
      ZEROLUX_BUILD_VERSION: ${{ needs.draft.outputs.version }}
      ZEROLUX_BUILD_CHANNEL: ${{ needs.draft.outputs.channel }}
      ZEROLUX_BUILD_COMMIT: ${{ needs.draft.outputs.commit }}
      ZEROLUX_BUILD_BUILT_AT: ${{ needs.draft.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          # Gradle's downloads, kept by the packages the Android project is generated from.
          cache: gradle
          cache-dependency-path: bun.lock
      # The native modules' C++ compiles through ccache, which the NDK runs when `NDK_CCACHE`
      # names it: its results are kept from one release to the next.
      - name: Install ccache
        run: command -v ccache || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache; }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # One entry for the native modules' versions: the repository's cache is shared.
          key: ccache-android-${{ hashFiles('bun.lock') }}
          restore-keys: ccache-android-
      - name: Generate the Android project
        working-directory: apps/mobile
        run: bun x --bun expo prebuild --platform android --no-install
      # Expo's template packs the Gradle wrapper so that `java -jar` cannot open it: Gradle
      # writes its own again, of the version the project names, in an empty project, which it
      # configures at once, unlike the app's.
      - name: Write the Gradle wrapper again
        working-directory: apps/mobile/android
        run: |
          version="$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          empty="$RUNNER_TEMP/gradle-wrapper"
          mkdir -p "$empty" && touch "$empty/settings.gradle"
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p "$empty" wrapper --gradle-version "$version" --no-daemon
          cp "$empty/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          cp "$empty/gradlew" "$empty/gradlew.bat" .
      # Gradle's build cache, kept with its downloads, and more memory than the template's for
      # shrinking and dexing.
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          # React Native's advice for CI: by the compiler's content, not its timestamp.
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache" NDK_CCACHE="$(command -v ccache)"
          # On a line of its own: Expo's file ends without one, on a value read as JSON.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --build-cache
          ccache --show-stats
      - name: Sign it and upload it
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          apk="zerolux-$TAG-android-arm64.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > release.keystore
            apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
            "$apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD "$apk"
            rm release.keystore
            "$apksigner" verify "$apk"
          fi
          gh release upload "$TAG" "$apk" --clobber

  publish:
    name: Publish
    needs: [checks, draft, desktop, android]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      CHANNEL: ${{ needs.draft.outputs.channel }}
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      ZEROLUX_UPDATE_PUBLIC_KEY: ${{ vars.ZEROLUX_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install the signature verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Read the release and current channel pointers
        id: release
        run: |
          mkdir -p "$RUNNER_TEMP/feed/previous"
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if [[ $'\n'$releases$'\n' == *$'\nupdates\n'* ]]; then
            assets="$(gh release view updates --json assets --jq '.assets[].name | select(. == "nightly.json" or . == "beta.json" or . == "stable.json")')"
            while IFS= read -r asset; do
              [[ -z "$asset" ]] || gh release download updates --pattern "$asset" --dir "$RUNNER_TEMP/feed/previous"
            done <<< "$assets"
          fi
      - name: Assemble and sign the channel feed
        if: steps.release.outputs.draft == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          gh release download "$TAG" --pattern build.json --pattern latest.json --pattern 'zerolux-*.sig' --dir "$RUNNER_TEMP/feed"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/feed/notes.md"
          bun scripts/release-ci.ts feed "$RUNNER_TEMP/feed"
          cd apps/desktop
          bun x --bun tauri signer sign --app-version "$VERSION" "$RUNNER_TEMP/feed/release.json"
          bun ../../scripts/release-ci.ts verify "$RUNNER_TEMP/feed/release.json"
          gh release upload "$TAG" "$RUNNER_TEMP/feed/release.json" "$RUNNER_TEMP/feed/release.json.sig" --clobber
          while IFS= read -r channel; do
            bun x --bun tauri signer sign --app-version "$VERSION" "$RUNNER_TEMP/feed/$channel.json"
            bun ../../scripts/release-ci.ts verify "$RUNNER_TEMP/feed/$channel.json"
            gh release upload "$TAG" "$RUNNER_TEMP/feed/$channel.json" "$RUNNER_TEMP/feed/$channel.json.sig" --clobber
          done < "$RUNNER_TEMP/feed/channels"
      - name: Recover pointers from the published release
        if: steps.release.outputs.draft != 'true'
        run: |
          gh release download "$TAG" --pattern '*.json' --pattern '*.json.sig' --dir "$RUNNER_TEMP/feed"
          bun scripts/release-ci.ts verify "$RUNNER_TEMP/feed/release.json"
          for channel in nightly beta stable; do
            if [[ -f "$RUNNER_TEMP/feed/$channel.json" ]]; then
              bun scripts/release-ci.ts verify "$RUNNER_TEMP/feed/$channel.json"
            fi
          done
          bun scripts/release-ci.ts restore "$RUNNER_TEMP/feed"
      - name: Publish immutable artifacts, then advance the channel
        env:
          DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          if [[ "$DRAFT" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --target "${{ needs.draft.outputs.commit }}" --prerelease --latest=false --title "Update channels" --notes "Signed update feeds for Nightly, Beta and Stable."
          fi
          while IFS= read -r channel; do
            gh release upload updates "$RUNNER_TEMP/feed/$channel.json" "$RUNNER_TEMP/feed/$channel.json.sig" --clobber
          done < "$RUNNER_TEMP/feed/channels"
