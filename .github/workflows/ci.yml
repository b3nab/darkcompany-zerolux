name: CI

on:
  workflow_call:
    inputs:
      tests:
        description: "The nextest profile: `ci` leaves out the tests slow by design, as on a push; `full` runs every one."
        type: string
        default: ci
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What is the same on every system, once: the format, the types and the web app's build.
  checks:
    name: Format, types and web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up (Bun, rustfmt)
        uses: ./.github/actions/setup
        with:
          rust: format
      - name: Format
        run: cargo fmt --all -- --check && bun run format:check
      # It also writes the renderer the web app's types import.
      - name: Web build
        run: bun run --cwd apps/web build
      - name: Typecheck
        run: bun run typecheck

  # The Rust workspace on each system: its lint and its tests, these in two halves side by side,
  # each built from the shared cache. PostgreSQL runs on Linux only, in jobs of their own:
  # GitHub runs service containers only there, and an empty image starts none.
  rust:
    name: Rust (${{ matrix.system }} ${{ matrix.part }}/2)
    strategy:
      fail-fast: false
      matrix:
        system: [Linux, Linux PostgreSQL, Windows, macOS]
        part: [1, 2]
        # Two tests a core: most of the slow ones wait on processes and timers, not the CPU.
        include:
          - { system: Linux, os: ubuntu-24.04, threads: 8 }
          - system: Linux PostgreSQL
            os: ubuntu-24.04
            threads: 8
            postgres: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          - { system: Windows, os: windows-2025, threads: 8 }
          - { system: macOS, os: macos-26, threads: 6 }
    runs-on: ${{ matrix.os }}
    env:
      # No debug info in these builds: less to write and link; a panic still says where.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # On Windows, Rust's own LLD links instead of Microsoft's linker; elsewhere it is unused.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: zerolux_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: zerolux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerolux_test -d zerolux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The runner's own Android, .NET and Haskell SDKs, unused here, go while the job sets up.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - name: Set up (Rust, nextest, Bun, uv, LiveKit)
        uses: ./.github/actions/setup
        with:
          cache-key: check
          # The jobs of a system build the same: its first half keeps the cache.
          cache-save: ${{ matrix.part == 1 && !matrix.postgres }}
          # What the tests start: the runners, the sign-in service, and Tauri's icons tool.
          workspaces: ./harnesses/* ./packages/bridge ./services/auth ./apps/desktop
          livekit: "true"
      # The desktop crate embeds its icons and the web app it serves: its lint and tests need
      # the icons and only the web app's folder, as the web build is checked once above.
      - name: Desktop icons and the web app's folder
        shell: bash
        run: |
          bun run --cwd apps/desktop assets icons
          mkdir -p apps/desktop/dist/web && echo '<!doctype html>' > apps/desktop/dist/web/index.html
      - name: Lint (clippy)
        if: matrix.part == 1 && !matrix.postgres
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (SQLite)
        if: ${{ !matrix.postgres }}
        env:
          NEXTEST_TEST_THREADS: ${{ matrix.threads }}
        run: cargo nextest run --workspace --profile ${{ inputs.tests || 'ci' }} --partition hash:${{ matrix.part }}/2
      # The whole workspace is built as the SQLite jobs build it; only the kernel's tests read
      # the database.
      - name: Tests (PostgreSQL)
        if: matrix.postgres
        env:
          NEXTEST_TEST_THREADS: ${{ matrix.threads }}
          ZEROLUX_TEST_POSTGRES_URL: postgresql://zerolux_test:fixture-only-password@127.0.0.1:5432/zerolux_test
        run: cargo nextest run --workspace --profile ${{ inputs.tests || 'ci' }} --partition hash:${{ matrix.part }}/2 -E 'package(zerolux)'
      # nextest runs no doctests: they run once, where they are the same on every system.
      - name: Doctests
        if: runner.os == 'Linux' && matrix.part == 1 && !matrix.postgres
        run: cargo test --workspace --doc

  js:
    name: JavaScript and Python (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2025 }
          - { name: macOS, os: macos-26 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up (Bun, uv)
        uses: ./.github/actions/setup
        with:
          rust: none
      - name: JavaScript and Python tests
        run: bun run test
