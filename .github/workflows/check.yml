name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: zerolux_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: zerolux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerolux_test -d zerolux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZEROLUX_TEST_POSTGRES_URL: postgresql://zerolux_test:fixture-only-password@127.0.0.1:5432/zerolux_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: check
      - name: Install LiveKit server for integration tests
        # Official v1.13.7 Linux amd64 asset and SHA-256:
        # https://github.com/livekit/livekit/releases/expanded_assets/v1.13.7
        run: |
          livekit_archive="$RUNNER_TEMP/livekit_1.13.7_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/livekit/livekit/releases/download/v1.13.7/livekit_1.13.7_linux_amd64.tar.gz -o "$livekit_archive"
          printf '%s  %s\n' '6634aeeb2fb1366b6723708ae4320b9d5408106a4c63457c5e845ae3979c90e2' "$livekit_archive" | sha256sum --check --strict
          tar -xzf "$livekit_archive" -C "$RUNNER_TEMP" livekit-server
          sudo install -m 0755 "$RUNNER_TEMP/livekit-server" /usr/local/bin/livekit-server
          livekit-server --version
      - run: bun run check

  # Windows has no PostgreSQL service container: the Rust tests run on SQLite there, as the
  # Linux job also runs them, beside its PostgreSQL ones. It does not fail the check until the
  # kernel's Windows port is through.
  windows:
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: check
      - name: Install LiveKit server for integration tests
        shell: bash
        # Official v1.13.7 Windows amd64 asset and SHA-256:
        # https://github.com/livekit/livekit/releases/expanded_assets/v1.13.7
        run: |
          livekit_archive="$RUNNER_TEMP/livekit_1.13.7_windows_amd64.zip"
          curl --fail --silent --show-error --location https://github.com/livekit/livekit/releases/download/v1.13.7/livekit_1.13.7_windows_amd64.zip -o "$livekit_archive"
          printf '%s  %s\n' 'e539e7d2f75807b9c9202cd2a0bf2cb3d52fc4c52978a6953e0f47bc339fe77f' "$livekit_archive" | sha256sum --check --strict
          7z x -bso0 "$livekit_archive" -o"$RUNNER_TEMP/livekit"
          echo "$RUNNER_TEMP/livekit" >> "$GITHUB_PATH"
      - run: livekit-server --version
      - run: bun run --cwd apps/desktop assets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: bun run typecheck
      - run: bun run test
