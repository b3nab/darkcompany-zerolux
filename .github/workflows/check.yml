name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: zerolux_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: zerolux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerolux_test -d zerolux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZEROLUX_TEST_POSTGRES_URL: postgresql://zerolux_test:fixture-only-password@127.0.0.1:5432/zerolux_test
      CC: clang-21
      CXX: clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4
      # webrtc-sys uses Chromium's hermetic libc++, which requires Clang 21+.
      # https://github.com/livekit/rust-sdks#building
      - name: Install LiveKit and desktop native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
          fingerprint="$(gpg --batch --show-keys --with-colons llvm.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -m 0644 llvm.asc /usr/share/keyrings/apt-llvm.asc
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          rm llvm.asc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang-21 libclang-21-dev libc6-dev libglib2.0-dev libjpeg-turbo8-dev pkg-config libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          clang-21 --version
          pkg-config --exists glib-2.0 gobject-2.0 gio-2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-24.04-clang-21
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install LiveKit server for integration tests
        # Official v1.13.7 Linux amd64 asset and SHA-256:
        # https://github.com/livekit/livekit/releases/expanded_assets/v1.13.7
        run: |
          livekit_archive="$RUNNER_TEMP/livekit_1.13.7_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/livekit/livekit/releases/download/v1.13.7/livekit_1.13.7_linux_amd64.tar.gz -o "$livekit_archive"
          printf '%s  %s\n' '6634aeeb2fb1366b6723708ae4320b9d5408106a4c63457c5e845ae3979c90e2' "$livekit_archive" | sha256sum --check --strict
          tar -xzf "$livekit_archive" -C "$RUNNER_TEMP" livekit-server
          sudo install -m 0755 "$RUNNER_TEMP/livekit-server" /usr/local/bin/livekit-server
          livekit-server --version
      - run: bun install --frozen-lockfile
      - run: bun run check
