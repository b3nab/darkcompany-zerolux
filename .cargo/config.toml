[target.'cfg(target_vendor = "apple")']
# Keep libwebrtc's Objective-C classes when linking the native LiveKit client.
rustflags = ["-C", "link-arg=-ObjC"]

[target.'cfg(all(windows, target_env = "msvc"))']
# libwebrtc is built against the static C runtime: link everything with it.
rustflags = ["-C", "target-feature=+crt-static"]
