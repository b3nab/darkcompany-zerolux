[extension]
id = "zerolux.plane"
name = "Plane"
version = "0.1.0"
publisher = "zerolux"
description = "Projects kept in Plane, cloud or self-hosted: each project a Plane project, its tasks the project's work items"
kernel = ">=0.0.1"

[dependencies]
"zerolux.projects" = ">=0.1"

[process]
command = ["bun", "run", "main.ts"]

[settings]
base_url = { type = "text", label = "Address", description = "Only for a Plane you host", default = "https://api.plane.so" }
workspace = { type = "text", label = "Workspace", description = "Its slug, as in its address" }
api_key = { type = "secret", label = "API key" }
