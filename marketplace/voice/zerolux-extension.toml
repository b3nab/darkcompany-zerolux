[extension]
id = "zerolux.voice"
name = "Voice"
version = "0.0.1"
publisher = "zerolux"
description = "Speech to text and agents' voices"
icon = "icon.png"
categories = ["meetings-voice", "agents-ai"]
keywords = ["speech", "transcription", "voices", "whisper"]
