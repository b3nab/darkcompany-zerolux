[extension]
id = "zerolux.voice"
name = "Voice"
version = "0.1.0"
publisher = "zerolux"
description = "Speech to text and agents' voices"

[process]
command = ["uv", "run", "--quiet", "--script", "main.py"]
start_seconds = 1800

[settings.transcription]
type = "choice"
label = "Transcription model"
default = "whisper"
options = [
  { value = "whisper", label = "Whisper large-v3 turbo" },
  { value = "parakeet", label = "Parakeet v3" },
  { value = "qwen3", label = "Qwen3-ASR 0.6B (Mac)" },
]
