[package]
name = "zerolux-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zerolux = { path = "../../../crates/zerolux" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon"] }
fs2 = "0.4"
tauri-plugin-opener = "2"
serde.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
tempfile = "3"
clap.workspace = true
uuid.workspace = true
tauri-plugin-notification = "2"
keyring = "4"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.7.3"
windows-registry = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSWindow",
  "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSString",
  "NSArray",
  "NSSet",
  "NSBundle",
  "NSObject",
  "NSError",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNUserNotificationCenter",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.17.0"
