[package]
name = "zerolux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
fs2 = "0.4"
livekit-api = { version = "0.8.1", features = ["rustls-tls-native-roots"] }
livekit = { version = "0.9.3", features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
sea-orm = { version = "2", default-features = false, features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-json",
] }
sea-orm-migration = { version = "2", default-features = false, features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
async-trait = "0.1.92"
base64 = "0.22"
portable-pty = "0.9.0"
croner = "4.0.1"
chrono = "0.4.45"
memchr = "2.8.3"
aho-corasick = "1.1.5"
toml = "1.1.8"
jsonschema = { version = "0.59.0", default-features = false }
semver = "1.0.28"
flate2 = "1"
dunce = "1.0.5"
libloading = "0.8"
tar = "0.4"
ed25519-dalek = "2"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[build-dependencies]
flate2 = "1.1.10"
sha2 = "0.10"
